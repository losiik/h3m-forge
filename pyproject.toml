[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3m-forge"
version = "0.1.0"
description = "Чтение, запись и генерация карт Heroes of Might and Magic III (.h3m), включая формат HotA"
requires-python = ">=3.12"
# Ядро формата принципиально держим на стандартной библиотеке:
# gzip + struct + enum. Меньше зависимостей — меньше поводов сломаться.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
